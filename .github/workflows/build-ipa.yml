name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (unsigned, OPENSOURCE_UNLOCKED)
        run: |
          cd "apps/ios/Orange Cloud"
          printf 'SWIFT_ACTIVE_COMPILATION_CONDITIONS = $(inherited) OPENSOURCE_UNLOCKED\nCODE_SIGNING_ALLOWED = NO\nCODE_SIGN_IDENTITY = \nOTHER_SWIFT_FLAGS = $(inherited) -Xfrontend -solver-expression-time-threshold=60\n' > unlock.xcconfig
          xcodebuild build \
            -project "Orange Cloud.xcodeproj" \
            -scheme "Orange Cloud" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -xcconfig unlock.xcconfig \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/Orange Cloud.app"
          [ -d "$APP" ] || APP=$(find "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos" -maxdepth 1 -name "*.app" | head -1)
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry OrangeCloud-unsigned.ipa Payload
          mkdir -p "$GITHUB_WORKSPACE/out"
          mv OrangeCloud-unsigned.ipa "$GITHUB_WORKSPACE/out/"

      - uses: actions/upload-artifact@v4
        with:
          name: OrangeCloud-unsigned-ipa
          path: out/OrangeCloud-unsigned.ipa
